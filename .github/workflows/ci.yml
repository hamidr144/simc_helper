name: CI

on:
  push:
    branches: [ main, dev, prod ]
  pull_request:
    branches: [ main, dev, prod ]

jobs:
  build:
    # t_7cc37158: include entries that omit all matrix dimension keys merge into
    # EVERY combination (later include wins), so only one job ever materialized;
    # each leg must carry its full combination. Default name only lists dimension
    # keys, so os is added explicitly to keep the two check-runs distinguishable.
    name: build (${{ matrix.os }}, ${{ matrix.python-version }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: linux
            python-version: "3.11"
          - os: macos-latest
            target: macos
            python-version: "3.11"
    steps:
      - uses: actions/checkout@v3
      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: ${{ matrix.python-version }}
      - name: Ensure pip is available
        run: |
          python -m ensurepip --upgrade
      # uv installation removed (not needed)
      - name: Install dependencies
        run: |
          python -m pip install -r requirements.txt
      - name: Configure CMake
        run: |
          TARGET=${{ matrix.target }}
          cmake -S . -B build -DTARGET_PLATFORM=$TARGET
      - name: Build Docker image (Linux)
        if: ${{ matrix.target == 'linux' }}
        run: |
          docker build -t simc-builder-linux -f Dockerfile.linux .
      - name: Build binaries
        run: |
          cmake --build build --target simc_master simc_worker
      - name: Run tests
        run: |
          pytest -q

  mobile-browser:
    name: mobile browser geometry
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: "3.11"
      - name: Install app and browser-test dependencies
        run: |
          python -m pip install -r requirements.txt -r requirements-browser.txt
          python -m playwright install --with-deps chromium
      - name: Run populated mobile geometry regression
        run: |
          pytest -q tests/test_mobile_geometry_browser.py
