<!DOCTYPE html>
<html lang="en" data-pal="dark">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>SimC Helper · History</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='7' fill='%23191a1b'/%3E%3Cpath d='M16 6.5l8 4.6v9.8l-8 4.6-8-4.6v-9.8z' fill='none' stroke='%237170ff' stroke-width='2' stroke-linejoin='round'/%3E%3Ccircle cx='16' cy='16' r='3.2' fill='%237170ff'/%3E%3C/svg%3E">
  <script>
  /* RED-3 theme pre-paint (contract §2): stored explicit choice wins; else OS. */
  (function(){var s=null;try{s=localStorage.getItem('simc-theme')}catch(e){}
  document.documentElement.dataset.pal=!s||s==='system'
    ?(matchMedia('(prefers-color-scheme: dark)').matches?'dark':'light'):s;})();
  </script>
  <link rel="stylesheet" href="static/css/tokens.css?v=red3-4">
</head>
<body>
<a class="skip skip-link" href="#history-content">Skip to runs</a>

<header class="top"><div class="topin">
  <b style="font-size:17px">SimC Helper</b>
  <span class="chip">Run history</span>
  <a class="back-link" id="history-back" href="history" hidden>← All runs</a>
  <span style="margin-left:auto"></span>
  <a class="btn-ghost" href="./">New comparison</a>
  <span class="pal">
    <span class="seg" role="radiogroup" aria-label="Theme">
      <button type="button" role="radio" data-th="system" aria-checked="false">System</button><button
      type="button" role="radio" data-th="light" aria-checked="false">Light</button><button
      type="button" role="radio" data-th="dark" aria-checked="false">Dark</button>
    </span>
  </span>
</div></header>

<main>
  <div class="phead"><h1 id="history-title">Your simulations</h1>
    <span class="sub" id="history-subtitle">Loading your stored runs…</span>
  </div>
  <section id="history-content" aria-live="polite"></section>
  <div class="footmeta"><span id="app-version"></span></div>
</main>

<script type="module" src="static/js/pages/history.js?v=red3-3"></script>
<noscript>
  <p class="noscript-warning">This application requires JavaScript to function.</p>
</noscript>
</body>
</html>
