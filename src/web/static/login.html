<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - Simulationcraft Helper</title>
    <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='6' fill='%23131415'/%3E%3Cpath d='M16 6l2.2 6.8L25 15l-6.8 2.2L16 24l-2.2-6.8L7 15l6.8-2.2z' fill='%237170ff'/%3E%3C/svg%3E">
    <link rel="stylesheet" href="static/style.css?v=20261016-gui-redesign-4">
</head>
<body>
    <main class="auth-page panel-card">
        <div class="auth-header">
            <h1>SimC Helper</h1>
            <p>Log in to access your simulation workspace</p>
        </div>

        <form method="post" action="login">
            <div class="form-group">
                <label for="username">Username</label>
                <input type="text" id="username" name="username" required autofocus autocomplete="username">
            </div>

            <div class="form-group">
                <label for="password">Password</label>
                <div class="auth-wrap">
                    <input type="password" id="password" name="password" required autocomplete="current-password">
                    <button type="button" class="pw-toggle" data-target="password" aria-pressed="false">Show</button>
                </div>
            </div>

            <div id="form-error" class="error-panel" role="alert" tabindex="-1" hidden></div>

            <button type="submit" class="btn-primary">Log In</button>
        </form>

        <div class="auth-link">
            <p>Don't have an account? <a href="register">Create an account</a></p>
        </div>
    </main>
    <script src="static/auth.js?v=20261016-gui-redesign-4"></script>
</body>
</html>
