<!DOCTYPE html>
<html lang="en" data-pal="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - Simulationcraft Helper</title>
    <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='6' fill='%23131415'/%3E%3Cpath d='M16 6l2.2 6.8L25 15l-6.8 2.2L16 24l-2.2-6.8L7 15l6.8-2.2z' fill='%237170ff'/%3E%3C/svg%3E">
      <script>
  /* RED-3 theme pre-paint (contract §2): stored explicit choice wins; else OS. */
  (function(){var s=null;try{s=localStorage.getItem('simc-theme')}catch(e){}
  document.documentElement.dataset.pal=!s||s==='system'
    ?(matchMedia('(prefers-color-scheme: dark)').matches?'dark':'light'):s;})();
  </script>
    <script>
  /* RED-3 theme pre-paint (contract §2): stored explicit choice wins; else OS. */
  (function(){var s=null;try{s=localStorage.getItem('simc-theme')}catch(e){}
  document.documentElement.dataset.pal=!s||s==='system'
    ?(matchMedia('(prefers-color-scheme: dark)').matches?'dark':'light'):s;})();
  </script>
  <link rel="stylesheet" href="static/css/tokens.css?v=red3-1">
  <link rel="stylesheet" href="static/css/auth.css?v=red3-1">
</head>
<body>
    <main class="auth-page panel-card">
        <div class="auth-header">
            <h1>SimC Helper</h1>
            <p>Log in to access your simulation workspace</p>
        </div>

        <form method="post" action="login">
            <div class="form-group">
                <label for="username">Username</label>
                <input type="text" id="username" name="username" required autofocus autocomplete="username">
            </div>

            <div class="form-group">
                <label for="password">Password</label>
                <div class="auth-wrap">
                    <input type="password" id="password" name="password" required autocomplete="current-password">
                    <button type="button" class="pw-toggle" data-target="password" aria-pressed="false">Show</button>
                </div>
            </div>

            <div id="form-error" class="error-panel" role="alert" tabindex="-1" hidden></div>

            <button type="submit" class="btn-primary">Log In</button>
        </form>

        <div class="auth-link">
            <p>Don't have an account? <a href="register">Create an account</a></p>
        </div>
    </main>
    <script type="module" src="static/js/auth.js?v=red3-1"></script>
</body>
</html>
