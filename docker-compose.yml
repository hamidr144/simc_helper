# =============================================================================
# SimC Helper — Docker Compose
# =============================================================================
#
# Usage:
#   # Start everything (master + 1 worker)
#   docker-compose up -d
#
#   # Start with 3 workers
#   docker-compose up -d --scale simc-worker=3
#
#   # Start with Redis for shared session storage (future)
#   docker-compose --profile redis up -d
#
#   # Stop everything
#   docker-compose down
#
# Environment variables (defaults are for local development):
#   HOST              Master bind host          (default: 0.0.0.0)
#   PORT              Master HTTP port          (default: 8000)
#   ADMIN_TOKEN       Admin API token           (required for production)
#   CLUSTER_SECRET    Master↔Worker secret      (required for production)
#   SIMC_PATH         Path to SimC binary       (optional)
#   SIMC_HELPER_DEV_MODE  Enable dev mode       (default: 0)
#   SIMC_NIGHTLY_TAG  Pinned SimC nightly tag   (default: 1210-2026-10-13-eaf8c46)
#   SIMC_ENGINE_MODE  nightly | source          (default: nightly; source =
#                     legacy in-container clone + compile fallback)
#
# Engine workflow: the 'engine-update' one-shot extracts the engine binary
# from the pinned simulationcraftorg/simc nightly image into the simc-engine
# volume; workers run it directly (no clone, no compile). The nightly image
# is amd64-only, so the worker runs as an amd64 container:
#   docker build --platform linux/amd64 -t simc-helper:latest-amd64 .
#
# =============================================================================

x-common: &common
  image: simc-helper:latest
  restart: unless-stopped
  volumes:
    - simc-data:/app/data
    - simc-logs:/app/logs
    - simc-inputs:/app/data/master/inputs
  healthcheck:
    test: ["CMD", "python3", "-c",
           "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
    interval: 30s
    timeout: 5s
    retries: 3
    start_period: 15s

services:
  # -----------------------------------------------------------------------
  # Engine update — one-shot: extracts the SimC engine binary + musl runtime
  # from the pinned official nightly image into the simc-engine volume.
  # The worker never clones or compiles; bump the engine by changing
  # SIMC_NIGHTLY_TAG (single source of truth, override via .env) and running:
  #   docker compose up -d engine-update && docker compose up -d --force-recreate simc-worker
  # List current tags: curl -s 'https://hub.docker.com/v2/repositories/simulationcraftorg/simc/tags?page_size=10&ordering=last_updated'
  # -----------------------------------------------------------------------
  engine-update:
    image: simulationcraftorg/simc:${SIMC_NIGHTLY_TAG:-1210-2026-10-13-eaf8c46}
    platform: linux/amd64
    restart: "no"
    entrypoint: ["/bin/sh", "/engine-update.sh"]
    environment:
      - NIGHTLY_TAG=${SIMC_NIGHTLY_TAG:-1210-2026-10-13-eaf8c46}
    volumes:
      - simc-engine:/volume
      - ./scripts/engine-update.sh:/engine-update.sh:ro

  # -----------------------------------------------------------------------
  # Master — FastAPI web server + task dispatcher
  # -----------------------------------------------------------------------
  simc-master:
    <<: *common
    ports:
      - "${PORT:-8000}:8000"
    environment:
      - HOST=${HOST:-0.0.0.0}
      - PORT=${PORT:-8000}
      - ADMIN_TOKEN=${ADMIN_TOKEN:-change-me-in-production}
      - CLUSTER_SECRET=${CLUSTER_SECRET:-change-me-in-production}
      - SIMC_HELPER_DEV_MODE=${SIMC_HELPER_DEV_MODE:-0}
      - CORS_ALLOWED_ORIGINS=["http://localhost:8000"]
    volumes:
      - ./config.json:/app/config.json:ro
      - simc-data:/app/data
      - simc-logs:/app/logs
      - simc-inputs:/app/data/master/inputs
      # Hot-reload the UI without rebuilding the image (dev-mode compose).
      - ./src/web/static:/app/src/web/static:ro

  # -----------------------------------------------------------------------
  # Worker(s) — distributed SimC execution nodes
  # -----------------------------------------------------------------------
  simc-worker:
    <<: *common
    # The official SimC nightly image is linux/amd64-only, so the nightly
    # engine binary can only execute in an amd64 worker (emulated on arm64
    # hosts). Build the worker image for amd64 alongside the default one:
    #   docker build --platform linux/amd64 -t simc-helper:latest-amd64 .
    image: simc-helper:latest-amd64
    platform: linux/amd64
    depends_on:
      engine-update:
        condition: service_completed_successfully
      simc-master:
        condition: service_healthy
    # The shared healthcheck probes an HTTP server; a worker runs none —
    # its liveness is the worker process (and its WebSocket to the master).
    healthcheck:
      test: ["CMD", "python3", "-c", "import pathlib,sys; ok=any('src.worker' in p.joinpath('cmdline').read_bytes().decode(errors='ignore') for p in pathlib.Path('/proc').iterdir() if p.name.isdigit() and p.joinpath('cmdline').exists()); sys.exit(0 if ok else 1)"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 5s
    environment:
      - MASTER_URL=http://simc-master:8000
      # Engine lives under BASE_DIR/thirdparties (the simc-engine volume).
      # Without BASE_DIR the worker falls back to ~/.simc, which is lost on
      # every recreate and triggers a fresh 7.5 GB clone + full compile.
      - BASE_DIR=/app
      # 'nightly': run the prebuilt engine extracted into the volume by the
      # engine-update service (no clone/compile). Set 'source' to fall back
      # to the legacy GitHub clone + make build under thirdparties/simc.
      - SIMC_ENGINE_MODE=${SIMC_ENGINE_MODE:-nightly}
      - SIMC_NIGHTLY_TAG=${SIMC_NIGHTLY_TAG:-1210-2026-10-13-eaf8c46}
      - CLUSTER_SECRET=${CLUSTER_SECRET:-change-me-in-production}
      - SIMC_HELPER_DEV_MODE=${SIMC_HELPER_DEV_MODE:-0}
      - WORKER_NAME=${WORKER_NAME:-worker}
      - SIMC_BUILD_JOBS=${SIMC_BUILD_JOBS:-2}
      - SIMC_UPDATE_INTERVAL_SECONDS=${SIMC_UPDATE_INTERVAL_SECONDS:-86400}
    volumes:
      # Persist the nightly engine (and, in source mode, the cloned SimC
      # source + compiled engine) across recreates; otherwise every `up -d`
      # re-clones ~7.5 GB and recompiles.
      - simc-engine:/app/thirdparties
    # Use the standalone binary for production:
    # entrypoint: ["/app/simc-worker"]
    # Default: run via Python in dev mode
    entrypoint: ["python3", "-m", "src.worker"]

  # -----------------------------------------------------------------------
  # Optional: Redis — shared state / caching layer (future use)
  # -----------------------------------------------------------------------
  # redis:
  #   image: redis:7-alpine
  #   restart: unless-stopped
  #   profiles:
  #     - redis
  #   volumes:
  #     - redis-data:/data
  #   healthcheck:
  #     test: ["CMD", "redis-cli", "ping"]
  #     interval: 10s
  #     timeout: 3s
  #     retries: 5

# ---------------------------------------------------------------------------
# Named volumes
# ---------------------------------------------------------------------------
volumes:
  simc-data:
    driver: local
  simc-logs:
    driver: local
  simc-inputs:
    driver: local
  simc-engine:
    driver: local
  redis-data:
    driver: local
